spring:
  application:
    name: concurrent-web-crawler

crawler:
  workers: 8
  max-pages: 500
  per-host-delay: 250ms
  request-timeout: 8s
  max-retries: 2
  max-response-bytes: 2000000
  max-concurrent-jobs: 2
  max-queued-jobs: 50
  user-agent: SohamCrawler/2.0 (+https://github.com/brohum10/concurrent-web-crawler)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
